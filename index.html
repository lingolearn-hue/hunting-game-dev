<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10201a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Hunting Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud .top { position: absolute; top: env(safe-area-inset-top, 0); left: 12px; right: 12px; padding-top: 8px;
    display: flex; justify-content: space-between; font-size: 14px; text-shadow: 0 0 3px #000; }
  #hud .dbg { position: absolute; top: calc(env(safe-area-inset-top, 0) + 34px); left: 12px; font-size: 12px; opacity: .8; text-shadow: 0 0 3px #000; }
  #hud .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #hud .toast { position: absolute; top: 30%; left: 12px; right: 12px; text-align: center; font-size: 22px;
    text-shadow: 0 0 4px #000; opacity: 0; transition: opacity .3s; }
  #hud .toast small { display: block; font-size: 12px; opacity: .85; margin-top: 4px; }
  #gallery { position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 20; overflow: auto; display: none;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 16px; touch-action: pan-y; }
  #gallery .ghead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  #gallery button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.4);
    border-radius: 8px; padding: 8px 14px; font-size: 14px; }
  #gallery .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  #gallery .item { position: relative; aspect-ratio: 3 / 4; background: #222; }
  #gallery .item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #gallery .badge { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.65); border-radius: 6px;
    padding: 2px 6px; font-size: 12px; }
  #gallery img.big { width: 100%; max-height: 62vh; object-fit: contain; display: block; margin-bottom: 8px; }
  #hud .overlay { position: absolute; inset: 0; pointer-events: none; }
  #hud .overlay.scope { background:
    linear-gradient(#000, #000) center / 2px 62vmin no-repeat,
    linear-gradient(#000, #000) center / 62vmin 2px no-repeat,
    radial-gradient(circle at 50% 50%, transparent 0, transparent 34vmin, #000 35vmin); }
  #hud .overlay.launcher { background: radial-gradient(circle at 50% 50%, transparent 0, transparent 9vmin, rgba(255,255,255,.55) 9.2vmin, transparent 9.6vmin); }
  #hud .threat { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 40px); text-align: center;
    font-size: 15px; font-weight: 700; color: #ff5a4a; text-shadow: 0 0 4px #000; display: none; }
  #hud .lock { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border: 2px solid #ffb040;
    border-radius: 6px; display: none; }
  #hud .lock.locked { border-color: #ff4a3a; animation: lockpulse .5s infinite alternate; }
  @keyframes lockpulse { from { transform: scale(1); } to { transform: scale(1.15); } }
  #hud .locktext { position: absolute; left: 0; right: 0; top: 58%; text-align: center; font-size: 14px; font-weight: 600;
    text-shadow: 0 0 4px #000; display: none; }
  #hud button.active { background: rgba(76,154,95,.75); }
  #hud .zoomcol { position: absolute; right: 49px; bottom: calc(env(safe-area-inset-bottom, 0px) + 282px);
    display: flex; flex-direction: column; gap: 8px; }
  #hud .zoomcol button { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 22px; line-height: 1; }
  #menu { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 15; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; }
  #menu button { width: 220px; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.4);
    border-radius: 10px; padding: 12px; font-size: 16px; }
  #hud .cross { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; }
  #hud .cross::before, #hud .cross::after { content: ""; position: absolute; background: #fff; opacity: .85; }
  #hud .cross::before { left: 11px; top: 0; width: 2px; height: 24px; }
  #hud .cross::after { top: 11px; left: 0; height: 2px; width: 24px; }
  #hud .bottom { position: absolute; bottom: env(safe-area-inset-bottom, 0); left: 0; right: 0; padding: 0 12px 12px;
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  #hud .bottom button { font-size: 12px; padding: 8px 10px; }
  #hud .joy { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); width: 110px; height: 110px;
    border-radius: 50%; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35);
    pointer-events: auto; touch-action: none; }
  #hud .joy.left { left: 16px; }
  #hud .joy.right { right: 16px; }
  #hud .knob { position: absolute; left: 33px; top: 33px; width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.5); pointer-events: none; }
  #hud .crouch { position: absolute; left: 35px; bottom: calc(env(safe-area-inset-bottom, 0px) + 186px);
    width: 72px; height: 72px; border-radius: 50%; padding: 0; font-size: 12px; }
  #hud .trigger { position: absolute; right: 29px; bottom: calc(env(safe-area-inset-bottom, 0px) + 186px);
    width: 84px; height: 84px; border-radius: 50%; padding: 0; font-size: 14px; font-weight: 600;
    background: rgba(200,60,50,.55); border-color: rgba(255,255,255,.7); touch-action: none; }
  @media (orientation: landscape) {
    #hud .crouch { left: 140px; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); }
    #hud .trigger { right: 140px; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); }
    #hud .zoomcol { right: 140px; bottom: calc(env(safe-area-inset-bottom, 0px) + 164px); flex-direction: row; }
  }
  #hud button { pointer-events: auto; background: rgba(0,0,0,.45); color: #fff; border: 1px solid rgba(255,255,255,.5);
    border-radius: 8px; padding: 10px 16px; font-size: 14px; }
  #start { position: fixed; inset: 0; background: #10201a; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; z-index: 10; }
  #start button { font-size: 18px; padding: 14px 28px; border-radius: 10px; border: 0; background: #4c9a5f; color: #fff; }
  #start #modeBtn { font-size: 14px; padding: 8px 16px; background: #2c4a38; }
  #levels { display: flex; flex-direction: column; gap: 10px; }
  #levels small { display: block; font-size: 12px; opacity: .8; margin-top: 2px; }
  #start p { max-width: 320px; opacity: .8; font-size: 14px; margin: 0; }
</style>
</head>
<body>
<div id="view"></div>
<div id="hud"></div>
<div id="start">
  <h1>Hunting Game</h1>
  <p>Hold the phone upright and look around. Left stick walks, right stick looks, red button = photo/fire, CROUCH for stealth, +/- or pinch to zoom. Desktop: drag to look, WASD to walk, C to crouch, wheel to zoom, 1/2/3 to switch equipment, click/Space to use, R to recalibrate.</p>
  <button id="modeBtn"></button>
  <div id="levels"></div>
  <p id="startMsg"></p>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
